name: Selenide Automation Tests - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read
      pull-requests: write

    strategy:
      matrix:
        java-version: ['11']

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java environment
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      # Step 3: Install Chrome
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Step 4: Run tests
      - name: Run Selenide Tests
        run: mvn clean test -Dselenide.headless=true -Dselenide.browser=chrome
        continue-on-error: true

      # Step 5: Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report || echo "Allure report generation completed"

      # Step 6: Publish test results
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/**/*.xml
          check_name: Selenide Test Results

      # Step 7: Upload Allure report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 30

      # Step 8: Upload screenshots (only if any exist)
      - name: Upload Test Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: target/screenshots/
          retention-days: 10
          if-no-files-found: ignore

      # Step 9: Notify on failure
      - name: Notify on Failure
        if: failure()
        run: echo "Tests failed! Review the artifacts for details."
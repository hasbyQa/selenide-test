name: Selenide Automation Tests - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read
      pull-requests: write
      pages: write
      id-token: write

    strategy:
      matrix:
        java-version: ['11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenide Tests
        id: run_tests
        run: mvn clean test -Dselenide.browser=chrome
        continue-on-error: true

      - name: Set test status
        id: test_status
        run: |
          if [ "${{ steps.run_tests.outcome }}" == "success" ]; then
            echo "status=PASSED" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "header_color=#28a745" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "header_color=#dc3545" >> $GITHUB_OUTPUT
          fi

      - name: Parse test results and extract failures
        id: parse_results
        if: always()
        run: |
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            t=$(grep -oP 'tests="\K[0-9]+' "$f" | head -1)
            fa=$(grep -oP 'failures="\K[0-9]+' "$f" | head -1)
            e=$(grep -oP 'errors="\K[0-9]+' "$f" | head -1)
            s=$(grep -oP 'skipped="\K[0-9]+' "$f" | head -1)
            TOTAL=$((TOTAL + ${t:-0}))
            FAILED=$((FAILED + ${fa:-0} + ${e:-0}))
            SKIPPED=$((SKIPPED + ${s:-0}))
          done
          PASSED=$((TOTAL - FAILED - SKIPPED))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          # Extract failure details using grep on surefire txt reports
          FAILURE_LINES=""
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            # Get lines with FAILURE and the message after it
            while IFS= read -r line; do
              if echo "$line" | grep -q "<<<"; then
                TEST=$(echo "$line" | grep -oP '\S+(?=\s+Time elapsed)')
                FAILURE_LINES="${FAILURE_LINES}${TEST}\n"
              fi
            done < "$f"
            # Get the failure message
            MSG=$(grep -A2 "AssertionFailedError\|AssertionError" "$f" | grep -v "^--$" | head -3 | tr '\n' ' ' | cut -c1-200)
            if [ -n "$MSG" ]; then
              FAILURE_LINES="${FAILURE_LINES}  → ${MSG}\n"
            fi
          done

          if [ -z "$FAILURE_LINES" ]; then
            FAILURE_LINES="No failures"
          fi

          # Write to file
          printf "%b" "$FAILURE_LINES" > /tmp/failures.txt
          cat /tmp/failures.txt

          # Single line for Slack (pipe separated)
          SLACK_LINE=$(printf "%b" "$FAILURE_LINES" | tr '\n' ' ' | cut -c1-500)
          echo "slack_failures=$SLACK_LINE" >> $GITHUB_OUTPUT

      - name: Build failure HTML for email
        id: failure_html
        if: always()
        run: |
          HTML=""
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            # Get failed test names
            while IFS= read -r line; do
              if echo "$line" | grep -q "FAILURE\|ERROR" && echo "$line" | grep -q "<<<"; then
                TEST=$(echo "$line" | grep -oP '\S+(?=\s+Time elapsed)' | head -1)
                if [ -n "$TEST" ]; then
                  # Get assertion message - look for expected/actual in the file
                  MSG=$(grep -A5 "$TEST" "$f" | grep -i "expected\|BUG\|assert\|actual" | head -2 | tr '\n' ' ' | cut -c1-300)
                  if [ -z "$MSG" ]; then
                    MSG=$(grep -A10 "FAILURES\|ERRORS" "$f" | grep -v "^$" | head -3 | tr '\n' ' ' | cut -c1-300)
                  fi
                  HTML="${HTML}<li style='margin-bottom:10px;'><strong style='color:#dc3545;'>${TEST}</strong><br/><span style='color:#666;font-size:13px;'>${MSG}</span></li>"
                fi
              fi
            done < "$f"
          done

          if [ -z "$HTML" ]; then
            HTML="<li style='color:#28a745;'>All tests passed successfully ✅</li>"
          fi

          # Save to file to handle special chars
          echo "$HTML" > /tmp/failures.html
          # Use base64 to pass safely
          ENCODED=$(base64 -w 0 /tmp/failures.html)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report || echo "Allure report generation completed"

      - name: Locate and prepare Allure Report
        if: always()
        id: allure_path
        run: |
          if [ -f "target/site/allure-maven-plugin/index.html" ]; then
            echo "path=target/site/allure-maven-plugin" >> $GITHUB_OUTPUT
          elif [ -f "target/site/allure-report/index.html" ]; then
            echo "path=target/site/allure-report" >> $GITHUB_OUTPUT
          elif [ -f "target/allure-report/index.html" ]; then
            echo "path=target/allure-report" >> $GITHUB_OUTPUT
          else
            mkdir -p target/allure-fallback
            python3 -c "
          content = '''<html><body style=\"font-family:Arial;text-align:center;padding:50px\">
          <h2>Allure report generation failed</h2>
          </body></html>'''
          with open('target/allure-fallback/index.html', 'w') as f:
              f.write(content)
          "
            echo "path=target/allure-fallback" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.allure_path.outputs.path }}

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/**/*.xml
          check_name: Selenide Test Results

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ${{ steps.allure_path.outputs.path }}
          retention-days: 30

      - name: Upload Test Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: target/screenshots/
          retention-days: 10
          if-no-files-found: ignore

      - name: Decode failure details
        if: always()
        id: decode
        run: |
          echo "${{ steps.failure_html.outputs.encoded }}" | base64 -d > /tmp/decoded_failures.html
          FAILURES=$(cat /tmp/decoded_failures.html)
          echo "failures<<HTMLEOF" >> $GITHUB_OUTPUT
          echo "$FAILURES" >> $GITHUB_OUTPUT
          echo "HTMLEOF" >> $GITHUB_OUTPUT

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ steps.test_status.outputs.emoji }} *Selenide CI — Tests ${{ steps.test_status.outputs.status }}*",
              "attachments": [
                {
                  "color": "${{ steps.test_status.outputs.color }}",
                  "fields": [
                    {"title": "📁 Repository", "value": "${{ github.repository }}", "short": true},
                    {"title": "🌿 Branch", "value": "${{ github.ref_name }}", "short": true},
                    {"title": "👤 Triggered by", "value": "${{ github.actor }}", "short": true},
                    {"title": "🔢 Run #", "value": "${{ github.run_number }}", "short": true},
                    {"title": "✅ Passed", "value": "${{ steps.parse_results.outputs.passed }}", "short": true},
                    {"title": "❌ Failed", "value": "${{ steps.parse_results.outputs.failed }}", "short": true},
                    {"title": "⏭️ Skipped", "value": "${{ steps.parse_results.outputs.skipped }}", "short": true},
                    {"title": "🧪 Total", "value": "${{ steps.parse_results.outputs.total }}", "short": true},
                    {"title": "📝 Commit", "value": "${{ github.event.head_commit.message }}", "short": false},
                    {"title": "🐛 Failed Tests", "value": "${{ steps.parse_results.outputs.slack_failures }}", "short": false},
                    {"title": "🏃 Pipeline Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false},
                    {"title": "📊 Allure Report", "value": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/", "short": false}
                  ],
                  "footer": "Selenide CI • GitHub Actions"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Gmail Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "${{ steps.test_status.outputs.emoji }} Selenide CI — Tests ${{ steps.test_status.outputs.status }} | Run #${{ github.run_number }} | ${{ github.repository }}"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: ${{ secrets.GMAIL_USERNAME }}
          html_body: |
            <html>
            <body style="font-family: Arial, sans-serif; max-width: 620px; margin: 0 auto; padding: 20px; background: #f5f5f5;">
              <div style="background-color: ${{ steps.test_status.outputs.header_color }}; color: white; padding: 24px 20px; border-radius: 8px 8px 0 0; text-align: center;">
                <h1 style="margin:0; font-size: 26px;">${{ steps.test_status.outputs.emoji }} Selenide CI Report</h1>
                <p style="margin: 8px 0 0 0; font-size: 16px; opacity: 0.9;">Tests ${{ steps.test_status.outputs.status }} — Run #${{ github.run_number }}</p>
              </div>
              <div style="background: white; border: 1px solid #ddd; border-top: none; padding: 24px; border-radius: 0 0 8px 8px;">
                <h3 style="margin: 0 0 12px 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px;">🧪 Test Results Summary</h3>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                  <tr>
                    <td style="padding: 10px; text-align: center; background: #e8f5e9; border-radius: 6px; width: 23%;">
                      <div style="font-size: 22px; font-weight: bold; color: #28a745;">${{ steps.parse_results.outputs.passed }}</div>
                      <div style="font-size: 12px; color: #555;">✅ Passed</div>
                    </td>
                    <td style="width: 4%;"></td>
                    <td style="padding: 10px; text-align: center; background: #fdecea; border-radius: 6px; width: 23%;">
                      <div style="font-size: 22px; font-weight: bold; color: #dc3545;">${{ steps.parse_results.outputs.failed }}</div>
                      <div style="font-size: 12px; color: #555;">❌ Failed</div>
                    </td>
                    <td style="width: 4%;"></td>
                    <td style="padding: 10px; text-align: center; background: #fff8e1; border-radius: 6px; width: 23%;">
                      <div style="font-size: 22px; font-weight: bold; color: #f0ad4e;">${{ steps.parse_results.outputs.skipped }}</div>
                      <div style="font-size: 12px; color: #555;">⏭️ Skipped</div>
                    </td>
                    <td style="width: 4%;"></td>
                    <td style="padding: 10px; text-align: center; background: #e3f2fd; border-radius: 6px; width: 23%;">
                      <div style="font-size: 22px; font-weight: bold; color: #0366d6;">${{ steps.parse_results.outputs.total }}</div>
                      <div style="font-size: 12px; color: #555;">🧪 Total</div>
                    </td>
                  </tr>
                </table>

                <h3 style="margin: 0 0 12px 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px;">🐛 Failed Test Details</h3>
                <div style="background: #fff8f8; border-left: 4px solid #dc3545; padding: 12px 16px; border-radius: 0 6px 6px 0; margin-bottom: 20px;">
                  <ul style="margin: 0; padding-left: 16px;">
                    ${{ steps.decode.outputs.failures }}
                  </ul>
                </div>

                <h3 style="margin: 0 0 12px 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px;">📋 Pipeline Details</h3>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px; font-weight: bold; color: #555; width: 40%;">📁 Repository</td>
                    <td style="padding: 10px;">${{ github.repository }}</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px; font-weight: bold; color: #555;">🌿 Branch</td>
                    <td style="padding: 10px;">${{ github.ref_name }}</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px; font-weight: bold; color: #555;">👤 Triggered by</td>
                    <td style="padding: 10px;">${{ github.actor }}</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px; font-weight: bold; color: #555;">🔢 Run Number</td>
                    <td style="padding: 10px;">#${{ github.run_number }}</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px; font-weight: bold; color: #555;">📝 Commit</td>
                    <td style="padding: 10px;">${{ github.event.head_commit.message }}</td>
                  </tr>
                </table>

                <div style="margin-top: 24px; text-align: center;">
                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                     style="background-color: #0366d6; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; margin: 6px;">
                    🏃 View Pipeline Run
                  </a>
                  <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
                     style="background-color: #6f42c1; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; margin: 6px;">
                    📊 View Live Allure Report
                  </a>
                </div>
                <p style="color: #aaa; font-size: 11px; text-align: center; margin-top: 24px; border-top: 1px solid #eee; padding-top: 12px;">
                  Automated notification from Selenide CI Pipeline • GitHub Actions • ${{ github.repository }}
                </p>
              </div>
            </body>
            </html>